<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Store Manager</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    
    <div class="nav-bar" id="user-navbar" style="display: flex;">
        <ul decoration="none">
            <li class="nav-bar-item"><a href="register.html">Register</a></li>
            <!-- Account: change username/password, logout -->
            <li id="account-item" class="nav-bar-item"><a href="account.html">Account</a></li>
        </ul>
        <button class="close-app-btn" onclick="closeApp()">
            <a>✕</a>
        </button>
    </div>
    <div class="nav-bar" id="admin-navbar" style="display: none;">
        <ul>
            <!-- Register: make sales, open multiple registers -->
            <li class="nav-bar-item active"><a href="register.html">Register</a></li>
            <!-- Stock: add products, check stock levels, remove products -->
            <li class="nav-bar-item"><a href="stock.html">Stock</a></li>
            <!-- Sales: view past sales, generate sales reports, calculate gain and loss, see refunds -->
            <li class="nav-bar-item"><a href="sales.html">Sales</a></li>
            <!-- Account: change admin name/password, change users roles, remove users, add users, logout -->
            <li id="account-item" class="nav-bar-item"><a href="account.html">Account</a></li>
        </ul>
        <button class="close-app-btn" onclick="closeApp()">
            <a>✕</a>
        </button>
    </div>

    <!-- Container for entire register -->
    <div class="register-container">
        
        <!-- Section 1: Register Tabs -->
        <div class="tabs-container" id="tabs-container">
            <div id="tabs" style="display: flex;">

                <div id="register-tab-1" class="register-tab active" onclick="switchRegister(1)">
                    <span class="tab-label">Register 1</span>
                    <button class="close-tab-btn btn-active" onclick="closeRegister(event, 1); return false;">×</button>
                </div>
            </div>

            <button class="add-tab-btn" onclick="createNewRegister()">+</button>
            
        </div>
        
        <!-- Section 2: Active Register Content -->
        <div class="register-content">
            
            <!-- Scan Product Area -->
            <div class="scan-area">
                <div class="scan-input-group">
                    <input type="text" id="scan-input" placeholder="Scan.." autofocus>
                    <button id="scan-button"class="primary-btn" onclick="scanProduct()">Add</button>
                </div>
                <div class="quick-actions">
                    <button id="divers-button" class="secondary-btn" onclick="openDiversModal()">Divers</button>
                    <button id="search-button" class="secondary-btn" onclick="openSeachModal()">Search</button>
                </div>
                
            </div>
            
            <!-- Items List -->
                <div class="cart-items-container">
                <!-- Table of scanned items -->
                    <div class="cart-items-table">
                        <div class="cart-items-head">
                            <div class="cart-table-cell head">Item</div>
                            <div class="cart-table-cell head">Price</div>
                            <div class="cart-table-cell head">Quantity</div>
                            <div class="cart-table-cell head">Total</div>
                            <div class="cart-table-cell head">Actions</div>
                        </div>
                        <div class="cart-items-body" id="cart-items-body">
                        <!-- Dynamically populated rows go here -->
                            <div id="loader-indicator" class="loader"></div>
                        </div>
                    </div>
                </div>
            <!-- Total Display -->
            <div class="total-display">
                <!-- Large total amount -->
                 <span class="total-label">TOTAL:</span>
                 <span id="total-amount" class="total-amount">0.00</span>
                 <span class="total-label">DZD</span>
            </div>
            
            <!-- Action Buttons -->
            <div class="action-buttons">
                <!-- Clear and Checkout buttons -->
                <button id="clear-btn" class="danger-btn" onclick="clearRegister()">Clear Register</button>
                <button id="checkout-btn" class="success-btn" onclick="checkout()">Checkout</button>
            </div>


            <!-- Modals -->
                <!-- Divers Modal -->
                            
            <div id="divers-modal" class="modal" style="display: none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Add Divers Item</h2>
                        <button class="close-modal" onclick="closeDiversModal()">×</button>
                    </div>
                    
                    <form id="divers-form" onsubmit="addDiversItem(event)">
                        <div class="modal-body">
                            <div class="form-group">
                                <label for="divers-name">Item Name:</label>
                                <input type="text" id="divers-name" name="item_name" placeholder="e.g. Misc Item" required>
                            </div>

                            <div class="form-group">
                                <label for="divers-price">Price:</label>
                                <input type="number" id="divers-price" name="item_price" placeholder="e.g. 0.00" step="0.01" required>
                            </div>

                            <div class="form-group">
                                <label for="divers-quantity">Quantity:</label>
                                <input type="number" id="divers-quantity" name="item_quantity" placeholder="e.g. 1" value="1" min="1" onfocus="this.select()" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="secondary-btn" onclick="closeDiversModal()">Cancel</button>
                            <button type="submit" class="primary-btn">Add Item</button>
                        </div>
                    </form>
                </div>
            </div>

                <!-- Search Modal -->
            <div id="search-modal" class="modal" style="display: none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Search Item</h2>
                        <button class="close-modal" onclick="closeSearchModal()">×</button>
                    </div>

                    <div class="modal-body">
                        <div class="form-group">
                            <input type="text" id="search-name" placeholder="Product name" oninput="searchProducts()">
                            
                            <div class="search-results-container">
                                <div class="search-results-head">
                                    <div>Item</div>
                                    <div>Price</div>
                                </div>
                                <div class="search-results-body" id="search-results-body">
                                    <!-- Dynamically populated -->
                                    <div id="loader-indicator" class="loader"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="modal-footer">
                        <button class="secondary-btn" onclick="closeSearchModal()">Cancel</button>
                    </div>
                </div>
            </div>



            <!-- Quantity Editor Modal -->
                        
            <div id="quantity-modal" class="modal" style="display: none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Edit Quantity</h2>
                        <button class="close-modal" onclick="closeQuantityModal()">×</button>
                    </div>

                    <!-- **ENCLOSE EVERYTHING in a <form> tag** -->
                    <form id="quantity-form" onsubmit="applyQuantity(event)"> 
                        <div class="modal-body">
                            <div class="form-group">
                                <label for="quantity-input">Quantity:</label>
                                <input type="number" id="quantity-input" data-item-id="" name="quantity" placeholder="e.g. 1" value="1" min="1" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="secondary-btn" onclick="closeQuantityModal()">Cancel</button>
                            <button type="submit" class="primary-btn">Select</button> 
                        </div>
                    </form>
                </div>
            </div>

            <!-- Generic Notification/Info Modal -->
            <div id="info-notification-modal" class="modal" style="display: none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 id="info-modal-title">Notification</h2>
                        <button class="close-modal" onclick="closeNotificationModal()">×</button>
                    </div>
                    <div class="modal-body">
                        <p id="info-modal-message">This is a generic information message.</p>
                    </div>
                    <div class="modal-footer">
                        <button id="ok-btn" class="primary-btn" onclick="closeNotificationModal()">OK</button>
                    </div>
                </div>
            </div>

    <script src="base.js"></script>
    <script src="register.js"></script>
</body>
</html>
