<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Store Manager</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="auth.css"> <!-- Link to your new auth styles -->
</head>
<body class="auth-body"> <!-- Apply the specific body class -->
    
    <div class="auth-container">
        <h1>Welcome Back</h1>
        
        <form id="login-form" onsubmit="login(event)">
            
            <div class="form-group">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" name="username" autofocus required>
            </div>
            
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" required>
            </div>
            
            <button type="submit" class="primary-btn">Log In</button>
        </form>
        
        <a href="signup.html" class="auth-link">Don't have an account? Sign Up here.</a>
    </div>

    <!-- Generic Notification/Info Modal -->
    <div id="info-notification-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="info-modal-title">Notification</h2>
                <button class="close-modal" onclick="closeNotificationModal()">×</button>
            </div>
            <div class="modal-body">
                <p id="info-modal-message">This is a generic information message.</p>
            </div>
            <div class="modal-footer">
                <button id="ok-btn" class="primary-btn" onclick="closeNotificationModal()">OK</button>
            </div>
        </div>
    </div>

    <script src="base.js"></script>
    <script src="auth.js"></script>
</body>
</html>
