<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Store Manager</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="auth.css"> <!-- Link to your new auth styles -->
</head>
<body class="auth-body"> <!-- Apply the specific body class -->
    
    <div class="auth-container">
        <h1>Create New Account</h1>
        
        <form id="register-form" onsubmit="register(event);">
            
            <div class="form-group">
                <label for="register-username">Username</label>
                <input type="text" id="register-username" name="username" required>
            </div>

            <div class="form-group">
                <label for="register-password">Password</label>
                <input type="password" id="register-password" name="password" required>
            </div>
            
            <div class="form-group">
                <label for="register-confirm-password">Confirm Password</label>
                <input type="password" id="register-confirm-password" name="confirm_password" required>
            </div>
            
            <!-- Store Managers are typically the ones registering new accounts, so default to a role -->
            <input type="hidden" name="role" value="cashier"> 
            
            <button type="submit" class="primary-btn">Register</button>
        </form>
        
        <a href="login.html" class="auth-link">Already have an account? Log In.</a>
    </div>
    <!-- Generic Notification/Info Modal -->
    <div id="info-notification-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="info-modal-title">Notification</h2>
                <button class="close-modal" onclick="closeNotificationModal()">×</button>
            </div>
            <div class="modal-body">
                <p id="info-modal-message">This is a generic information message.</p>
            </div>
            <div class="modal-footer">
                <button id="ok-btn" class="primary-btn" onclick="closeNotificationModal()">OK</button>
            </div>
        </div>
    </div>

    <script src="base.js"></script>
    <script src="auth.js"></script>
</body>
</html>
